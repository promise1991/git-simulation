name: CI - Security & Quality
on:
  pull_request:
    branches: [develop, main]

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build & Test
        run: cd app && mvn test || echo "tests skipped for simulation"

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@91e7c2c36dcad14149d8e455b960af62a2ffb275 # v0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

      - name: Build Docker
        run: cd app && mvn package -DskipTests && docker build -t teamsim/app:latest .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@91e7c2c36dcad14149d8e455b960af62a2ffb275 # v0.33.1
        with:
          image-ref: 'teamsim/app:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  tfsec:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          args: . --soft-fail

  sonar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@v2.2.0
        continue-on-error: true