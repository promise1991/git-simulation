name: cd
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to DEV (auto)
        run: echo "Deploying to DEV - ${{ github.sha }}"
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to STAGING
        run: echo "Deploying to STAGING - approved by ${{ github.actor }}"
  deploy-prod:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to PROD
        run: echo "Deploying to PROD - prod protection passed"
